services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-research-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - QDRANT_MODE=memory
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=20
      - ALLOWED_ORIGINS=*
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
